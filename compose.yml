services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: easymall
      MYSQL_USER: easymall
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell}
    volumes:
      - easymall_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  easymall_mysql:
