server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: easymall
  profiles:
    default: mysql
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Keep these short: on a Redis failure the request falls back to MySQL after one timeout.
      timeout: 200ms
      connect-timeout: 200ms
management:
  health:
    redis:
      # Redis is an optional cache; its outage must not mark the application DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  seed-data: ${SEED_DATA:false}
  token-hours: 12
  signature:
    # Every request that carries a Bearer token must be signed with the signKey returned by login (see docs/API.md).
    enabled: ${SIGNATURE_ENABLED:true}
    # Derives each login's signKey; at least 32 characters. Empty: a random key per process,
    # so users log in again after a restart and multiple instances cannot share tokens.
    master-key: ${SIGN_MASTER_KEY:}
    # Accepted difference between X-Timestamp and server time; nonces are kept for the same period.
    max-skew: 300s
    max-body-size: 64KB
    # memory: single instance. redis: shared across instances; a Redis error rejects signed requests with 503.
    nonce-store: ${SIGN_NONCE_STORE:memory}
    memory-nonce-capacity: 1000000
  search-cache:
    # Caches the total of the public product search (GET /api/products) in Redis.
    enabled: ${SEARCH_CACHE_ENABLED:false}
    # Upper bound on how stale a total can be after a change that bypassed the application.
    ttl: ${SEARCH_CACHE_TTL:60s}
    failure-backoff: 5s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
